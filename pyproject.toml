[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-dl-core"
version = "0.4.0"
description = "Direct video URLs from Russian anime players: Aniboom, CVH, Kodik, Sibnet, Animedia, AniLibria, VK Video, SovetRomantica"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ialakey" }]
keywords = ["anime", "parser", "player", "aniboom", "kodik", "cvh", "sibnet", "animedia", "anilibria", "vk", "alloha", "hls", "dash"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Natural Language :: Russian",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
async = ["aiohttp>=3.9"]
socks = ["requests[socks]>=2.28", "aiohttp-socks>=0.8"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
anime-dl-core = "anime_dl_core.cli:run"

[project.urls]
Homepage = "https://github.com/ialakey/anime-dl-core"
Source = "https://github.com/ialakey/anime-dl-core"
Issues = "https://github.com/ialakey/anime-dl-core/issues"
Changelog = "https://github.com/ialakey/anime-dl-core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_dl_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: тесты, которые ходят в интернет (запуск: ANIME_DL_CORE_LIVE=1 pytest -m live)",
]
asyncio_mode = "auto"
